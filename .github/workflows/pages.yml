name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests/web_artifact_smoke.cjs"
      - "scripts/verify-deploy.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # The runtime is built locally in eden_emscripten and published with `npm run publish-runtime`.
      - name: Download runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download runtime --repo "$GITHUB_REPOSITORY" --dir web/runtime --pattern 'eden.*' --pattern 'eden_archive.*' --pattern runtime.json
      # Optional engine builds for cores that run on them (web/cores.js `runtime`), one release each.
      - name: Download runtime variants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for variant in fused; do
            if gh release view "runtime-$variant" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release download "runtime-$variant" --repo "$GITHUB_REPOSITORY" --dir "web/runtime/$variant" --pattern 'eden.*' --pattern 'eden_archive.*' --pattern runtime.json
            fi
          done
      - name: Verify runtime
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const fs = require("node:fs");
            const dirs = ["web/runtime", ...fs.readdirSync("web/runtime", { withFileTypes: true })
              .filter(e => e.isDirectory()).map(e => "web/runtime/" + e.name)];
            for (const dir of dirs) {
              const manifest = JSON.parse(fs.readFileSync(dir + "/runtime.json"));
              for (const [file, { sha256 }] of Object.entries(manifest.files)) {
                const actual = createHash("sha256").update(fs.readFileSync(dir + "/" + file)).digest("hex");
                if (actual !== sha256) throw new Error(dir + "/" + file + " checksum mismatch");
              }
              if (manifest.build && manifest.build !== "release") throw new Error("refusing to deploy a " + manifest.build + " build from " + dir);
              console.log(dir + " " + manifest.engineRevision + " verified");
            }'
          node tests/web_artifact_smoke.cjs
      # One place for the deployed version: package.json version, this commit and the engine revision.
      - name: Write version
        run: |
          node -e '
            const fs = require("node:fs");
            const { version } = JSON.parse(fs.readFileSync("package.json"));
            const runtime = JSON.parse(fs.readFileSync("web/runtime/runtime.json"));
            fs.writeFileSync("web/version.json", JSON.stringify({
              version,
              webRevision: process.env.GITHUB_SHA.slice(0, 7),
              engineRevision: runtime.engineRevision,
              deployedAt: new Date().toISOString(),
            }, null, 2) + "\n");'
          cat web/version.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # Fails the run if the live site is missing a widget, module or runtime file from this commit.
      - name: Verify deployment
        run: node scripts/verify-deploy.mjs "${{ steps.deployment.outputs.page_url }}" "$GITHUB_SHA"
